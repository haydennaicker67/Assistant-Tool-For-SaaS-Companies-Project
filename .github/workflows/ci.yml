name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        env:
          # The RLS leak test requires a TEST_DATABASE_URL
          # We use a dummy value here so CI doesn't fail, but in a real pipeline
          # you would spin up a Postgres service container
          TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
        run: pnpm test

      - name: Build
        run: |
          # Create a dummy .env file for Next.js to read
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres" >> .env
          echo "EMBED_JWT_SECRET=dummy_secret_for_ci_build_only_12345" >> .env
          echo "ENCRYPTION_KEY=12345678901234567890123456789012" >> .env
          echo "NEXT_PUBLIC_API_BASE_URL=http://localhost:3001" >> .env
          echo "NEXT_PUBLIC_SUPABASE_URL=https://dummy.supabase.co" >> .env
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=dummy_anon_key" >> .env
          
          # Run the build
          pnpm build